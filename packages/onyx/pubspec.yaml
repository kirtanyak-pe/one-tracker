name: onyx
description: "Onyx: the One apps' design system. Monochrome, quiet, built on the widgets layer with no Material."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned: icons are a visual contract across every One app.
  lucide_icons_flutter: 3.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: fonts/InterDisplay-Bold.ttf
          weight: 700
